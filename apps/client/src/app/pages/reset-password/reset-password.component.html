@if (!reset()) {
  <div class="form-page">
    <div class="form-card">
      <h2 class="form-title">Choose a new password</h2>
      <p class="form-subtitle">Pick a password you don't use anywhere else.</p>

      <form (submit)="submitRequest()">
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <input
            class="form-input"
            id="password"
            type="password"
            name="password"
            placeholder="Choose a password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <input
            class="form-input"
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            placeholder="Enter it again"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            required
          />
          @if (mismatch()) {
            <span class="field-error">Those passwords don't match.</span>
          }
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="!canSubmit()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Saving…
          } @else {
            Set new password
          }
        </button>
      </form>

      <p class="form-footer">
        <tfa-link href="/login" styleClass="form-footer-link">Back to sign in</tfa-link>
      </p>
    </div>
  </div>
} @else {
  <div class="form-page">
    <div class="status-card">
      <i class="pi pi-check-circle status-icon"></i>
      <h3>Password updated</h3>
      <p>You can now sign in with your new password.</p>
      <p class="form-footer">
        <tfa-link href="/login" styleClass="form-footer-link">Go to sign in</tfa-link>
      </p>
    </div>
  </div>
}
