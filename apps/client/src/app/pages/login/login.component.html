<div class="form-page">
  <div class="form-card">
    <h2 class="form-title">Sign in</h2>
    <p class="form-subtitle">Welcome back to The Film Archive.</p>

    <form (submit)="submitRequest()">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input
          class="form-input"
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username or email"
          [(ngModel)]="this.req().userNameOrEmail"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-input"
          id="password"
          type="password"
          name="password"
          placeholder="Enter your password"
          [(ngModel)]="this.req().password"
          required
        />
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="form-footer">
      <tfa-link href="/forgotPassword" styleClass="form-footer-link">Forgot your password?</tfa-link>
    </p>
  </div>
</div>
