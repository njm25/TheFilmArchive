<div class="page-header">
  <h2>Users</h2>
  <p>Manage user accounts and roles.</p>
</div>

<div class="data-list">
  @for (user of users(); track user.id) {
    <div class="data-item">
      <div class="data-item-info">
        <span class="data-item-label">{{ user.userName }}</span>
        <span class="data-item-sub">{{ user.email }}</span>
      </div>
      <div class="data-item-actions">
        <tfa-dropdown
          class="role-select"
          [options]="roles"
          [value]="user.role"
          (valueChange)="onRoleChange(user.id, $event)"
          ariaLabel="Change role"
        ></tfa-dropdown>
      </div>
    </div>
  }
  @empty {
    <div class="empty-state">No users found.</div>
  }
</div>
