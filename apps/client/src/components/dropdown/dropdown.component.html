<div class="tfa-overlay tfa-dropdown" [class.open]="open()">
  <button
    type="button"
    class="tfa-overlay-trigger"
    [class.tfa-overlay-trigger--ghost]="variant() === 'ghost'"
    [class.tfa-overlay-trigger--sm]="size() === 'sm'"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() || placeholder()"
  >
    <span class="tfa-overlay-value" [class.tfa-overlay-value--placeholder]="variant() === 'field' && !hasValue()">{{ selectedOption()?.label ?? placeholder() }}</span>
    <i class="pi pi-chevron-down tfa-overlay-caret"></i>
  </button>

  @if (open()) {
    <ul class="tfa-overlay-menu" role="listbox">
      @for (option of options(); track option.label) {
        <li
          class="tfa-overlay-option"
          [class.selected]="option.value === value()"
          role="option"
          [attr.aria-selected]="option.value === value()"
          (click)="select(option)"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value()) {
            <i class="pi pi-check tfa-overlay-check"></i>
          }
        </li>
      }
    </ul>
  }
</div>
