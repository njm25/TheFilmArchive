<div class="tfa-overlay tfa-multiselect" [class.open]="open()">
  <button
    type="button"
    class="tfa-overlay-trigger"
    [class.tfa-overlay-trigger--sm]="size() === 'sm'"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() || placeholder()"
  >
    <span class="tfa-overlay-value">{{ summaryLabel() }}</span>
    <i class="pi pi-chevron-down tfa-overlay-caret"></i>
  </button>

  @if (open()) {
    <ul class="tfa-overlay-menu" role="listbox" aria-multiselectable="true">
      @for (option of options(); track option.label) {
        <li
          class="tfa-overlay-option"
          role="option"
          [attr.aria-selected]="isSelected(option.value)"
          (click)="toggleValue(option.value)"
        >
          <span class="tfa-overlay-checkbox" [class.checked]="isSelected(option.value)">
            @if (isSelected(option.value)) {
              <i class="pi pi-check"></i>
            }
          </span>
          <span>{{ option.label }}</span>
        </li>
      }
      @empty {
        <li class="tfa-overlay-option tfa-overlay-option--empty">No options</li>
      }
    </ul>
  }
</div>
