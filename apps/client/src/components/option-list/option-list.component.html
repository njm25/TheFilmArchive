<div class="tfa-option-list" role="radiogroup">
  @for (option of options(); track option.label) {
    <button
      type="button"
      class="tfa-option-list-item"
      [class.selected]="option.value === value()"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      (click)="select(option)"
    >
      <span class="tfa-option-list-radio"></span>
      <span class="tfa-option-list-text">
        <span class="tfa-option-list-label">{{ option.label }}</span>
        @if (option.sublabel) {
          <span class="tfa-option-list-sublabel">{{ option.sublabel }}</span>
        }
      </span>
    </button>
  } @empty {
    <div class="tfa-option-list-empty">{{ emptyLabel() }}</div>
  }
</div>
